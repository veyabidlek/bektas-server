# Production stack for bektas.app's backend, on the droplet.
#
# Why it moved here: the Vercel deployment (bektas-server.vercel.app) returned
# 500 FUNCTION_INVOCATION_FAILED because its Supabase project no longer
# exists — the pooler answers `FATAL (ENOTFOUND) tenant/user … not found`.
# Same move as madyas-api (Vercel → droplet, 2026-07-20).
#
# STORAGE: SQLite, on Bektas's call (2026-08-01) — a personal site is a
# single-writer, read-heavy workload, and a file-on-disk removes the exact
# failure class that just took the site down (an external database vanishing).
# Backup is `cp` of one file; `scripts/backup.sh` keeps 14 daily copies.
#
# ⚠️ Two things that would silently break it:
#   1. SUPABASE_DATABASE_URL must stay UNSET — app/database.py prefers it over
#      DATABASE_URL and would point back at the dead host.
#   2. The db file must live on the named volume below. Writing it inside the
#      image layer means the data disappears on the next `docker compose up
#      --build`.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLAlchemy SQLite URL — four slashes = absolute path.
      DATABASE_URL: sqlite:////data/bektas.db
    volumes:
      - bektas_data:/data
    ports:
      - "127.0.0.1:8013:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/profile')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Personal Telegram bot — a SEPARATE container so a bot crash cannot take the
  # website down, sharing the same image (no extra build) and the same .env.
  # Long polling only, so it binds no port. Without PERSONAL_BOT_TOKEN it logs
  # why and idles rather than crash-looping under `restart: unless-stopped`.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/bektas.db
    volumes:
      - bektas_data:/data
    depends_on:
      app:
        condition: service_started
    command: ["python", "-m", "app.bot"]
    # Inherits the app image's healthcheck, which curls :8000 — the bot serves
    # nothing, so it would fail forever.
    healthcheck:
      disable: true

volumes:
  bektas_data:
